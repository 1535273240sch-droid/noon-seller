name: noon-seller
x-api-image: &app-image
  image: noon-seller-api:0.1.0
  build:
    context: ../..
    dockerfile: infra/docker/Dockerfile

services:
  db:
    image: postgres:16.13-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: noon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generate .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?generate .env}
      MIGRATE_DB_PASSWORD: ${MIGRATE_DB_PASSWORD:?generate .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD","pg_isready","-h","127.0.0.1","-U","postgres","-d","noon"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.8-bookworm
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?generate .env}
    command: ["redis-server","--appendonly","yes","--maxmemory-policy","noeviction","--requirepass","${REDIS_PASSWORD:?generate .env}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  storage:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z@sha256:c20d112390b9a9ce8c11b8af95ad35bcaa62f4759663c09c936cd8d2b511f329
    environment:
      MINIO_ROOT_USER: noon-storage-admin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?generate .env}
    command: ["server","/data","--console-address",":9001"]
    ports:
      - "127.0.0.1:9100:9000"
    volumes:
      - objects:/data

  storage-init:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z@sha256:c20d112390b9a9ce8c11b8af95ad35bcaa62f4759663c09c936cd8d2b511f329
    entrypoint: ["/bin/sh","/init/init-storage.sh"]
    environment:
      MINIO_ROOT_USER: noon-storage-admin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?generate .env}
      STORAGE_APP_SECRET: ${STORAGE_APP_SECRET:?generate .env}
    volumes:
      - ./init-storage.sh:/init/init-storage.sh:ro
      - ./bucket-policy.json:/init/bucket-policy.json:ro
    depends_on:
      storage:
        condition: service_started

  migrate:
    <<: *app-image
    command: ["npm","run","db:migrate"]
    environment:
      DATABASE_URL: postgresql://noon_migrate:${MIGRATE_DB_PASSWORD:?generate .env}@db:5432/noon
    depends_on:
      db:
        condition: service_healthy

  grants:
    image: postgres:16.13-bookworm
    environment:
      PGPASSWORD: ${MIGRATE_DB_PASSWORD:?generate .env}
    command: ["psql","-h","db","-U","noon_migrate","-d","noon","-v","ON_ERROR_STOP=1","-f","/init/grants.sql"]
    volumes:
      - ./grants.sql:/init/grants.sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *app-image
    environment:
      APP_ENV: ${APP_ENV:-dev}
      HOST: 0.0.0.0
      PORT: 3100
      CORS_ORIGINS: ${CORS_ORIGINS:?generate .env}
      DATABASE_URL: postgresql://noon_app:${APP_DB_PASSWORD:?generate .env}@db:5432/noon
      REDIS_URL: redis://:${REDIS_PASSWORD:?generate .env}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?generate .env}
      CREDENTIALS_MASTER_KEY: ${CREDENTIALS_MASTER_KEY:?generate .env}
      S3_ENDPOINT: http://storage:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9100
      S3_REGION: us-east-1
      S3_BUCKET: noon-assets
      AWS_ACCESS_KEY_ID: noon-storage
      AWS_SECRET_ACCESS_KEY: ${STORAGE_APP_SECRET:?generate .env}
    ports:
      - "127.0.0.1:3100:3100"
    depends_on:
      grants:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3100/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  bootstrap:
    <<: *app-image
    profiles: ["bootstrap"]
    command: ["node","apps/api/dist/identity/bootstrap.js"]
    environment:
      DATABASE_URL: postgresql://noon_app:${APP_DB_PASSWORD:?generate .env}@db:5432/noon
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:?generate .env}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?generate .env}
    depends_on:
      grants:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
  objects:
